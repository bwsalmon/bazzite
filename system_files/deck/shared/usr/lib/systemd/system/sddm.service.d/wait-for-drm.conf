# Don't start the greeter before the GPU it needs is ready, and keep trying for
# a while longer if it still comes up empty, instead of dropping the machine on
# a black screen for the rest of the boot.
# See https://github.com/ublue-os/bazzite/issues/3622
[Unit]
StartLimitIntervalSec=90
StartLimitBurst=10

[Service]
ExecStartPre=-/usr/libexec/bazzite-wait-for-drm
RestartSec=3s
